  <script>
    const papers = [{"id": "2608.10041", "category": "cond-mat", "title": "Analytic Boundary Terms for Arbitrary Crystal Geometries and Direct-Sum Evaluation of Madelung Constants in Triclinic Lattices", "abstract": "The direct-sum evaluation of Madelung constants is complicated by the conditional convergence of lattice sums, which gives rise to a shape-dependent boundary term. In this work, we present, for the first time, a closed-form analytic expression for this boundary term that is valid for arbitrary crystal geometries. For general triclinic lattices, this boundary term maps exactly onto the electrostatic potential generated by a set of uniformly charged parallelograms. In addition, we demonstrate that the residual finite-size correction for a crystal of characteristic size $p$ decays as $(2p+1)^{-2}$. Building on these results, we develop a robust direct-sum method for the accurate computation of Madelung constants in arbitrary triclinic lattices and validate its effectiveness through explicit calculations on representative Bravais lattices.", "url": "https://arxiv.org/abs/2608.10041", "type": "理论+数值", "summary": "马德隆常数的直接求和计算由于晶格和的条件收敛而变得复杂，这产生了形状相关的边界项。在这项工作中，我们首次提出了该边界项的封闭式解析表达式，该表达式对于任意晶体几何形状都有效。对于一般的三斜晶格，该边界项精确地映射到由一组均匀带电的平行四边形产生的静电势。此外，我们证明了特征尺寸 $p$ 晶体的剩余有限尺寸校正衰减为 $(2p+1)^{-2}$。基于这些结果，我们开发了一种鲁棒的直和方法，用于精确计算任意三斜晶格中的马德隆常数，并通过对代表性布拉维晶格的显式计算来验证其有效性。", "authors": [{"name": "Yang He"}, {"name": "Zhonghan Hu"}], "featured_authors": [{"name": "Yang He"}, {"name": "Zhonghan Hu"}], "author_count": 2}, {"id": "2608.10048", "category": "cond-mat", "title": "Numerical modeling of microstructure evolution in nanocrystalline alloys - grain boundary segregation, solute drag and mechanics", "abstract": "Nanocrystalline (NC) alloys hold much promise as structural alloys due to their superior mechanical properties over traditional coarser grained microcrystalline alloys. Strength of metallic alloys is related to the underlying grain size - as represented by the classical Hall-Petch relation. Generally, a metals strength increases with decreasing mean grain size from the micrometer scale to the nanometer scale, until about a mean size of 20 nm. Any further decrease of grain size results in decreasing strength. Thus, there is an optimal range of mean grain size for most metals about which maximum material strength can be obtained. In the context of NC alloys, stabilization of the grain size in this optimal range is one of the primary synthesis challenges. Since nm-scale mean grain sizes are desired, phenomena like GB solute segregation and solute precipitation are utilized during alloy synthesis to mitigate grain growth. Numerical modeling the phenomena of GB-solute interactions and the evolution of these stabilized GBs under mechanical load are of immense interest to the NC alloy community. To enrich the numerical modeling formulations available in this space, we present here a phase-field method based numerical framework to model GB segregation, solute precipitation and effect of external loading on NC alloys. While some of these effects have been modeled in isolation, a unified treatment of the solute and GB segregation with mechanics interactions has not be considered in the literature. We present a 3D FEM finite-strain phase-field formulation for modeling grain evolution and microstructure stabilization. Beyond the formulation, various case studies demonstrate the applicability of this framework. Further, thermodynamic and kinetic arguments are provided based on the evolution of GB energy to explain the effects of solute drag, GB pinning and mechanical deformation.", "url": "https://arxiv.org/abs/2608.10048", "type": "理论+数值", "summary": "纳米晶 (NC) 合金由于其机械性能优于传统的粗晶微晶合金，因此作为结构合金具有广阔的前景。金属合金的强度与底层晶粒尺寸有关 - 正如经典的 Hall-Petch 关系所示。一般来说，金属强度随着平均晶粒尺寸从微米级到纳米级的减小而增加，直到平均尺寸约为20nm。晶粒尺寸的任何进一步减小都会导致强度下降。因此，对于大多数金属来说，存在一个最佳的平均晶粒尺寸范围，在该范围内可以获得最大的材料强度。在NC合金的背景下，将晶粒尺寸稳定在这个最佳范围内是主要的合成挑战之一。由于需要纳米级的平均晶粒尺寸，因此在合金合成过程中利用晶界溶质偏析和溶质沉淀等现象来减轻晶粒生长。对晶界-溶质相互作用现象的数值模拟以及这些稳定晶界在机械负载下的演化引起了数控合金界的极大兴趣。\n\n为了丰富该领域可用的数值模拟公式，我们在此提出了一种基于相场方法的数值框架，用于模拟 GB 偏析、溶质沉淀和外部载荷对 NC 合金的影响。虽然其中一些效应是单独建模的，但文献中尚未考虑通过力学相互作用对溶质和 GB 偏析进行统一处理。我们提出了一种 3D FEM 有限应变相场公式，用于模拟晶粒演化和微观结构稳定。除了表述之外，各种案例研究也证明了该框架的适用性。此外，基于晶界能量的演化提供了热力学和动力学论证，以解释溶质阻力、晶界钉扎和机械变形的影响。", "authors": [{"name": "Prakarsh Pandey"}, {"name": "Shiva Rudraraju"}], "featured_authors": [{"name": "Prakarsh Pandey"}, {"name": "Shiva Rudraraju"}], "author_count": 2}, {"id": "2608.10059", "category": "cond-mat", "title": "Cell Natural Orbitals in Quantum Materials", "abstract": "Understanding correlated quantum matter starts with an accurate model of the single-particle states that interact at low energies: their dispersion, band geometry, orbital content and charge density. In many cases, notably the topological bands of moire materials, it is not straightforward to find a real-space description with a few local orbitals that accomplishes this task. Here we provide a systematic way to identify the local degrees of freedom that best capture the band geometry and charge density of any chosen set of bands. We use the unit-cell one-particle reduced density matrix (UC-1pRDM), obtained by restricting the projector onto the target bands to a single unit cell. Its eigenstates, which we call cell natural orbitals (CNOs), form a local, symmetric basis uniquely determined by the Bloch wavefunctions and the choice of real-space partition. Their eigenvalues measure the occupation of each CNO in the target bands, quantifying entanglement across unit-cell boundaries and the importance of multi-orbital character. A set of CNOs that maximizes total spectral weight and reproduces the target band symmetries provides optimal trial states for Wannierization. We exemplify this by constructing a lattice model for twisted bilayer WSe$_2$ that tracks the orbital content across twist angles.", "url": "https://arxiv.org/abs/2608.10059", "type": "理论", "summary": "了解相关量子物质始于低能量相互作用的单粒子态的精确模型：它们的色散、能带几何形状、轨道含量和电荷密度。在许多情况下，特别是莫尔材料的拓扑带，找到具有几个局部轨道的实空间描述来完成此任务并不容易。在这里，我们提供了一种系统方法来识别局部自由度，该自由度最好地捕获任何选定能带组的能带几何形状和电荷密度。我们使用单位单元单粒子降低密度矩阵（UC-1pRDM），该矩阵是通过将目标波段上的投影仪限制为单个单位单元而获得的。它的本征态，我们称之为细胞自然轨道（CNO），形成了由布洛赫波函数和实空间分区的选择唯一确定的局部对称基础。它们的特征值衡量每个 CNO 在目标带中的占据情况，量化跨晶胞边界的纠缠以及多轨道特征的重要性。一组最大化总光谱权重并再现目标频带对称性的 CNO 为 Wannierization 提供了最佳试验状态。\n\n我们通过构建扭曲双层 WSe$_2$ 的晶格模型来证明这一点，该模型跟踪扭曲角上的轨道内容。", "authors": [{"name": "Harshitra Mahalingam"}, {"name": "Nishchhal Verma"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Harshitra Mahalingam"}, {"name": "Nishchhal Verma"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "author_count": 4}, {"id": "2608.10340", "category": "cond-mat", "title": "Giant mode splitting of azimuthal spin waves in radial vortices", "abstract": "Radial vortex is a topological spin texture stabilized by the interfacial Dzyaloshinskii-Moriya interaction (DMI) in ferromagnetic disks. Previous investigations have shown that the doublet splitting of azimuthal modes in traditional circular vortices arises from the coupling between azimuthal spin waves and vortex core (VC), an effect occurs only for azimuthal indices $m=\\pm1$ and is absent for higher-order modes. Here, we present a giant mode splitting of azimuthal spin waves in radial vortices, even in the absence of the VC. This mode splitting arises from the DMI, which can be an order of magnitude larger than that induced by the VC. Moreover, the DMI-induced frequency splitting increases with both the DMI constant and mode index, reaching tens of GHz for higher-order azimuthal modes. Our results reveal a robust mechanism for mode splitting in chiral magnetic textures and deepen the fundamental understanding of the DMI effect on the spin-wave dynamics in confined magnets.", "url": "https://arxiv.org/abs/2608.10340", "type": "理论", "summary": "径向涡旋是一种由铁磁盘中的界面 Dzyaloshinskii-Moriya 相互作用 (DMI) 稳定的拓扑自旋结构。先前的研究表明，传统圆形涡旋中方位角模式的双峰分裂是由方位角自旋波与涡核（VC）之间的耦合引起的，仅对方位角指数$m=\\pm1$产生影响，而对于高阶模式则不存在。在这里，即使没有 VC，我们也提出了径向涡旋中方位角自旋波的巨大模式分裂。这种模式分裂是由 DMI 引起的，它可能比 VC 引起的模式分裂大一个数量级。此外，DMI 引起的频率分裂随着 DMI 常数和模式指数的增加而增加，对于高阶方位角模式达到数十 GHz。我们的结果揭示了手性磁性纹理中模式分裂的稳健机制，并加深了对 DMI 对受限磁体自旋波动力学影响的基本理解。", "authors": [{"name": "Zhenyu Wang"}, {"name": "Liangrui Li"}, {"name": "Xuejuan Liu"}, {"name": "Xiansi Wang"}, {"name": "Ruifang Wang"}, {"name": "H. Y. Yuan"}], "featured_authors": [{"name": "Zhenyu Wang"}, {"name": "Liangrui Li"}, {"name": "Xuejuan Liu"}, {"name": "Xiansi Wang"}, {"name": "Ruifang Wang"}, {"name": "H. Y. Yuan"}], "author_count": 6}, {"id": "2608.10352", "category": "cond-mat", "title": "Equilibrium Distributions for Strongly Nonlinear Many-Body Systems", "abstract": "Obtaining equilibrium distributions of nonlinear systems is essential for accurately computing macroscopic observables. Conventional theoretical corrections are typically limited to weak nonlinearities, where interaction terms can be treated as effectively uncorrelated perturbations and the random phase approximation applies. In this Letter, we develop a framework to determine equilibrium distributions based on the generalized energy equipartition principle. Our approach recovers existing corrections in the weakly nonlinear regime and, crucially, remains valid for strong nonlinearities, where perturbative contributions become correlated and conventional approaches break down. Numerical simulations of the nonlinear Schrödinger equation, the Majda-McLaughlin-Tabak model, and the Fermi-Pasta-Ulam-Tsingou model demonstrate accurate corrections for nonlinearities more than an order of magnitude stronger than those accessible to conventional theories.", "url": "https://arxiv.org/abs/2608.10352", "type": "理论+数值", "summary": "获得非线性系统的平衡分布对于精确计算宏观可观测量至关重要。传统的理论校正通常仅限于弱非线性，其中相互作用项可以被视为有效的不相关扰动并且应用随机相位近似。在这封信中，我们开发了一个框架来根据广义能量均分原理确定平衡分布。我们的方法恢复了弱非线性区域中的现有校正，并且至关重要的是，对于强非线性区域仍然有效，在强非线性区域中，扰动贡献变得相关并且传统方法失效。非线性薛定谔方程、Majda-McLaughlin-Tabak 模型和 Fermi-Pasta-Ulam-Tsingou 模型的数值模拟表明，对非线性的精确校正比传统理论强一个数量级以上。", "authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "featured_authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "author_count": 3}, {"id": "2608.10353", "category": "cond-mat", "title": "Metallic Bonding-Driven Elastic Softness and Optical Response in the Mg-Rich Laves-Phase LaMg2", "abstract": "A systematic first-principles investigation of the structural, electronic, mechanical, and optical properties of the cubic C15 Laves-phase intermetallic compound LaMg2 is performed within density functional theory. The calculated elastic constants satisfy the mechanical stability criteria for cubic crystals, confirming the intrinsic stability of the C15 phase. LaMg2 exhibits relatively low bulk, shear, and Young's moduli, indicating enhanced compressibility and elastic softness compared with transition-metal-based Laves phases. Direction-dependent elastic analysis reveals moderate anisotropy in Young's modulus, shear modulus, and Poisson's ratio, whereas linear compressibility remains nearly isotropic, consistent with the high crystallographic symmetry. The ductile nature of LaMg2 is supported by Pugh's ratio and Poisson's ratio, suggesting resistance to brittle failure and the dominance of metallic bonding. Electronic structure calculations confirm metallic behavior with a finite density of states at the Fermi level, primarily originating from La-5d states, accompanied by delocalized charge density characteristic of metallic interactions. The optical response further reflects the metallic nature through high reflectivity, strong optical conductivity at low photon energies, and pronounced absorption in the ultraviolet region. The combination of mechanical compliance, ductility, and metallic optical response highlights LaMg2 as a promising lightweight intermetallic material for applications requiring structural stability, damage tolerance, and efficient electromagnetic shielding or reflective components.", "url": "https://arxiv.org/abs/2608.10353", "type": "理论+数值", "summary": "在密度泛函理论中对立方 C15 Laves 相金属间化合物 LaMg2 的结构、电子、机械和光学性质进行了系统的第一性原理研究。计算出的弹性常数满足立方晶体的机械稳定性标准，证实了 C15 相的固有稳定性。 LaMg2 表现出相对较低的体积模量、剪切模量和杨氏模量，表明与过渡金属基拉夫斯相相比，其可压缩性和弹性柔软度有所提高。方向相关的弹性分析揭示了杨氏模量、剪切模量和泊松比的中等各向异性，而线性压缩率几乎保持各向同性，与高晶体学对称性一致。 LaMg2 的延展性得到了 Pugh 比和泊松比的支持，表明其具有抗脆性破坏的能力以及金属键合的主导地位。电子结构计算证实了费米能级具有有限态密度的金属行为，主要源自La-5d态，并伴有金属相互作用的离域电荷密度特征。\n\n光学响应通过高反射率、低光子能量下的强光导率以及在紫外区域的显着吸收进一步反映了金属性质。机械柔顺性、延展性和金属光学响应的​​结合凸显了 LaMg2 作为一种有前途的轻质金属间材料，适用于需要结构稳定性、损伤容限和高效电磁屏蔽或反射组件的应用。", "authors": [{"name": "Farjana Mou"}, {"name": "S. M. Nazmus Shakib Pias"}, {"name": "M A Islam"}, {"name": "Md Zahidur Rahaman"}], "featured_authors": [{"name": "Farjana Mou"}, {"name": "S. M. Nazmus Shakib Pias"}, {"name": "M A Islam"}, {"name": "Md Zahidur Rahaman"}], "author_count": 4}, {"id": "2608.10428", "category": "cond-mat", "title": "Quadrupolar phase transition in superconducting lanthanum hydride", "abstract": "Lanthanum hydride (LaH$_{10}$) has been widely studied for its high superconducting critical temperature of 250 K at about 170 GPa pressure. Although the structural ${R\\bar{3}m}$-to-${Fm\\bar{3}m}$ transition under pressure connected to the emergence of the superconducting phase in this material is broadly understood, the detailed characterization of its nature and its order parameter are still missing. By applying the cluster multipole moment analysis to the hydrogen sublattice, we reveal that this transition is triggered by a quadrupolar $T_{2g}$ order parameter, and we provide evidence for its weak first-order nature. By performing path integral molecular dynamics coupled to a message-passing atomic cluster expansion (MACE) neural network potential, trained on Perdew-Burke-Ernzerhof (PBE) density functional theory configurations, we show that the collapse of the order parameter at the transition is simultaneously associated with the discontinuous softening of the optical $T_{2g}$ phonons. Their symmetry lets them carry a non-negligible electron-phonon coupling in LaH$_{10}$, while the weak first-order nature of the transition makes them soft. The presence of structural instabilities with low-frequency quadrupolar distortions can be a key ingredient to enhance superconductivity in superhydrides and provides guidance for the discovery of new high-$T_c$ superconductors in hydrogen-rich compounds.", "url": "https://arxiv.org/abs/2608.10428", "type": "理论+数值", "summary": "氢化镧 (LaH$_{10}$) 因其在约 170 GPa 压力下 250 K 的高超导临界温度而受到广泛研究。尽管人们广泛了解与该材料中超导相的出现相关的压力下结构${R\\bar{3}m}$到${Fm\\bar{3}m}$的转变，但仍然缺乏其性质及其有序参数的详细表征。通过将簇多极矩分析应用于氢亚晶格，我们揭示了这种转变是由四极 $T_{2g}$ 阶参数触发的，并为其弱一阶性质提供了证据。通过执行与消息传递原子团簇扩展 (MACE) 神经网络势耦合的路径积分分子动力学，并在 Perdew-Burke-Ernzerhof (PBE) 密度泛函理论配置上进行训练，我们表明过渡处序参数的崩溃同时与光学 $T_{2g}$ 声子的不连续软化相关。它们的对称性使它们在 LaH$_{10}$ 中携带不可忽略的电子声子耦合，而跃迁的弱一阶性质使它们变得柔软。\n\n低频四极畸变结构不稳定性的存在可能是增强超氢化物超导性的关键因素，并为在富氢化合物中发现新型高 T_c$ 超导体提供指导。", "authors": [{"name": "Abhishek Raghav"}, {"name": "Kousuke Nakano"}, {"name": "Marco Cherubini"}, {"name": "Ryotaro Arita"}, {"name": "Michele Casula"}], "featured_authors": [{"name": "Abhishek Raghav"}, {"name": "Kousuke Nakano"}, {"name": "Marco Cherubini"}, {"name": "Ryotaro Arita"}, {"name": "Michele Casula"}], "author_count": 5}, {"id": "2608.10432", "category": "cond-mat", "title": "Universal Density Control of Surface Reconstruction in Two-Dimensional Metals", "abstract": "We identify a unified thickness criterion for surface reconstruction in ultrathin metal sheets. The critical thickness is governed by the change in surface atomic density upon reconstruction: thinning always favors structural changes that increase this density. Thus, thinning suppresses the (1x2) reconstruction of 5d noble metal (110) sheets but promotes the quasi-hexagonal reconstruction of 4d noble metal (001) sheets. Density functional calculations validate these trends and show only minor corrections from surface stress and quantum-oscillation effects.", "url": "https://arxiv.org/abs/2608.10432", "type": "理论+数值", "summary": "我们确定了超薄金属板表面重建的统一厚度标准。临界厚度由重建时表面原子密度的变化决定：减薄总是有利于增加该密度的结构变化。因此，减薄抑制了 5d 贵金属 (110) 片的 (1x2) 重建，但促进了 4d 贵金属 (001) 片的准六边形重建。密度泛函计算验证了这些趋势，并且仅显示了表面应力和量子振荡效应的微小修正。", "authors": [{"name": "Jinyuan Yang"}, {"name": "Xiaoliang Zhong"}], "featured_authors": [{"name": "Jinyuan Yang"}, {"name": "Xiaoliang Zhong"}], "author_count": 2}, {"id": "2608.10465", "category": "cond-mat", "title": "Machine-learning approach for the phase stability and mechanical properties of disordered alloys at finite temperature", "abstract": "The prediction of stable alloys forming solid-state solutions across large portions of the composition space is a serious theoretical challenge, since one has to evaluate the Gibbs free energy, including both configurational and vibrational contributions. This requires an energy theory capable of extremely high throughput. By taking the Ni-Pd system as prototype, we construct an efficient Jacobi-Legendre machine-learning potential based on density-functional-theory data, which provides accurate energies and forces across the entire composition space. Based on a cluster expansion up to three-body terms and only 873 trainable parameters, this allows us to compute the partition function by directly integrating all accessible microstates, differing for composition, atomic configuration and thermal agitation. We confirm that Ni and Pd are fully miscible, forming an $fcc$ solid-state solution. This is only metastable at room temperature, while becomes thermodynamically stable at around 600~K, with the stability achieved first at the Pd-rich end of the composition range. Interestingly, entropy and heat capacity analysis reveal a competition between the solid-state solution and two intermetallic phases with long-period L1$_0$ structure for NiPd and NiPd$_3$. All in all, our approach offers a powerful and high-throughput workflow for the study of disordered alloys, an approach that can be extended to multi-component systems such as high-entropy alloys.", "url": "https://arxiv.org/abs/2608.10465", "type": "理论+数值", "summary": "预测稳定合金在大部分成分空间中形成固态溶液是一项严峻的理论挑战，因为必须评估吉布斯自由能，包括构型和振动贡献。这需要具有极高吞吐量的能量理论。通过以 Ni-Pd 系统为原型，我们基于密度泛函理论数据构建了高效的 Jacobi-Legendre 机器学习势，它提供了整个合成空间的准确能量和力。基于高达三体项的簇扩展和仅 873 个可训练参数，这使我们能够通过直接集成所有可访问的微观状态（成分、原子构型和热搅拌不同）来计算配分函数。我们确认 Ni 和 Pd 完全混溶，形成 $fcc$ 固态溶液。这仅在室温下是亚稳态的，而在 600~K 左右时变得热力学稳定，并且首先在成分范围的富 Pd 端实现稳定性。\n\n有趣的是，熵和热容分析揭示了 NiPd 和 NiPd$_3$ 的固态溶液与具有长周期 L1$_0$ 结构的两个金属间相之间的竞争。总而言之，我们的方法为无序合金的研究提供了强大且高通量的工作流程，这种方法可以扩展到高熵合金等多组分系统。", "authors": [{"name": "Rutchapon Hunkao"}, {"name": "Urvesh Patil"}, {"name": "Stefano Sanvito"}], "featured_authors": [{"name": "Rutchapon Hunkao"}, {"name": "Urvesh Patil"}, {"name": "Stefano Sanvito"}], "author_count": 3}, {"id": "2608.10520", "category": "cond-mat", "title": "Higher-Order Topological States with Cleavage-Dependent Dirac Mass", "abstract": "Topological quantum chemistry based on local charge profiles lacks predictive power for the crystalline cleavage of higher-order topological insulators (HOTIs). By cleaving an obstructed atomic insulator, we discover a topological phase characterized by e/2 fractional charges localized at precisely half of the corners, while the remaining empty corners host complementary vacancies of interstice charge. These zero-energy charge-vacancies and topological corners form a spatially balanced geometry, confined separately by C2 rotation symmetry. Crucially, we demonstrate that the emergence of corner zero modes dictates that specific dangling bonds-acting as the mass of a Dirac fermion-must explicitly expose in, and subtly slope toward, the corner regions. This strict directionality is verified by the anisotropic evolution of the mass term within a (2+1)-dimensional parameter space. Moreover, we find that the topological corners acquire lower entanglement entropy compared to the bulk, a behavior opposite to that of the real-space energy distribution.", "url": "https://arxiv.org/abs/2608.10520", "type": "理论", "summary": "基于局部电荷分布的拓扑量子化学缺乏对高阶拓扑绝缘体（HOTI）晶体分裂的预测能力。通过劈裂受阻的原子绝缘体，我们发现了一种拓扑相，其特征是 e/2 分数电荷恰好位于一半的角上，而其余的空角则具有间隙电荷的互补空位。这些零能电荷空位和拓扑角形成空间平衡的几何形状，分别受到 C2 旋转对称性的限制。至关重要的是，我们证明零角模式的出现决定了特定的悬挂键（充当狄拉克费米子的质量）必须明确暴露在角区域，并巧妙地向角区域倾斜。这种严格的方向性通过 (2+1) 维参数空间内质量项的各向异性演化得到验证。此外，我们发现与体积相比，拓扑角获得较低的纠缠熵，这种行为与真实空间能量分布相反。", "authors": [{"name": "Hongyu Chen"}, {"name": "Min Long"}, {"name": "Chuang Chen"}, {"name": "Zi Yang Meng"}], "featured_authors": [{"name": "Hongyu Chen"}, {"name": "Min Long"}, {"name": "Chuang Chen"}, {"name": "Zi Yang Meng"}], "author_count": 4}, {"id": "2608.10536", "category": "cond-mat", "title": "Anomalous current fluctuations in the stochastic XNOR hopping model", "abstract": "We consider fluctuations of the spin current in the stochastic XNOR process, a kinetically constrained hopping model in one spatial dimension. We formulate three conjectures with explicit amplitudes for the long-time current distributions: a Gaussian limit on the $t^{1/4}$ scale for homogeneous initial states with nonzero magnetization, a half-normal limit on the $t^{1/4}$ scale for domain-wall states with opposite magnetizations, and an M-Wright limit on the $t^{1/8}$ scale for homogeneous initial states at zero magnetization. Earlier work identified the tracer mechanism and anticipated the scaling exponents and limiting shapes in the domain-wall and zero-magnetization settings. Starting from the microscopic XNOR dynamics, we predict the missing amplitudes for the continuous-time process and extend the picture to homogeneous biased initial data. Simulations provide numerical support for all three conjectures without fitted parameters. A separate mathematical companion paper presents an extensively AI-generated candidate proof. Generative-AI tools were used in the research and writing workflow.", "url": "https://arxiv.org/abs/2608.10536", "type": "理论+数值", "summary": "我们考虑随机 XNOR 过程中自旋流的波动，随机 XNOR 过程是一个空间维度中的动力学约束跳跃模型。我们对长时电流分布提出了具有显式振幅的三个猜想：对于非零磁化强度的均匀初始态，$t^{1/4}$尺度上的高斯极限；对于具有相反磁化强度的磁畴壁态，$t^{1/4}$尺度上的半法线极限；以及对于零磁化强度均匀初始态的$t^{1/8}$尺度上的M-Wright极限。早期的工作确定了示踪剂机制，并预测了磁畴壁和零磁化设置中的缩放指数和限制形状。从微观 XNOR 动力学开始，我们预测连续时间过程的缺失幅度，并将图像扩展到同质偏置初始数据。模拟为所有三个猜想提供了数值支持，无需拟合参数。另一篇数学配套论文提出了人工智能生成的广泛候选证明。研究和写作工作流程中使用了生成式人工智能工具。", "authors": [{"name": "Balázs Pozsgay"}], "featured_authors": [{"name": "Balázs Pozsgay"}], "author_count": 1}, {"id": "2608.10556", "category": "cond-mat", "title": "Topological states of generalized dissipative Majorana wires", "abstract": "We study the generalized one-dimensional (1D) quantum dissipative models corresponding to a Majorana wire which can possess more than one Majorana bound state at each end. The system consists of a 1D fermionic open quantum system whose dynamics is governed by a quadratic Lindblad equation. Using the adjoint Lindblad equation for the fermionic two-point correlations, we find the gaps in the damping and purity spectra of a generic 1D model. Then, using the symmetry-based classification, we show that a winding number as the topological invariant can be defined which distinguishes different steady states of the system in the presence of damping and purity gaps. Then we focus on certain models with different Lindblad quantum jump terms and explore their phase diagrams by calculating the damping and the purity gaps as well as the winding number. In particular, we show that by inclusion of quantum jumps between next-nearest-neighbor sites, higher winding numbers and, equivalently, more Majorana bound states can be achieved. Also, by introducing imbalanced couplings, we can switch between states with negative and positive winding numbers. Finally, we should mention that since our formulation is based on the fermionic correlations rather than the Majorana operators, it can be easily extended to the dissipative topological phases belonging to other symmetry classes.", "url": "https://arxiv.org/abs/2608.10556", "type": "理论+数值", "summary": "我们研究了与马约拉纳线相对应的广义一维 (1D) 量子耗散模型，该线的每一端都可以拥有多个马约拉纳束缚态。该系统由一维费米子开放量子系统组成，其动力学由二次 Lindblad 方程控制。使用费米子两点相关性的伴随 Lindblad 方程，我们找到了通用一维模型的阻尼谱和纯度谱中的间隙。然后，使用基于对称性的分类，我们证明可以定义作为拓扑不变量的绕数，该绕数可以在存在阻尼和纯度间隙的情况下区分系统的不同稳态。然后我们关注具有不同 Lindblad 量子跃迁项的某些模型，并通过计算阻尼和纯度间隙以及绕数来探索它们的相图。特别是，我们表明，通过在次最近邻位点之间包含量子跃迁，可以实现更高的缠绕数以及更多的马约拉纳束缚态。此外，通过引入不平衡耦合，我们可以在具有负绕组数和正绕组数的状态之间切换。\n\n最后，我们应该提到，由于我们的公式是基于费米子相关性而不是马约拉纳算子，因此它可以很容易地扩展到属于其他对称类的耗散拓扑相。", "authors": [{"name": "Farokhnaz Hosseinifar"}, {"name": "Ali G. Moghaddam"}], "featured_authors": [{"name": "Farokhnaz Hosseinifar"}, {"name": "Ali G. Moghaddam"}], "author_count": 2}, {"id": "2608.10639", "category": "cond-mat", "title": "Dynamical Crossover in Landau$-$Zener Tunneling in Dissipative Rydberg Lattices", "abstract": "In this work, we investigate the excitation dynamics of a Rabi-coupled dissipative Rydberg lattice with a time-dependent detuning. The system is analyzed using (i) a Lindblad master equation within a mean-field approximation and (ii) an effective non-Hermitian Hamiltonian framework. While the mean-field approach captures the emergence of an antiferromagnetic order in the Rydberg excitation profile, the non-Hermitian description provides direct insight into the complex energy spectrum and its avoided crossings, which govern the Landau$-$Zener dynamics. We identify a regime in which the sublattice population imbalance vanishes near the avoided crossing, resulting in identical Landau$-$Zener probabilities on the two sublattices. Beyond a critical effective blockade strength there is a dynamical crossover to another regime in which the sublattice population imbalance persists through the avoided crossing, giving rise to sublattice-dependent Landau$-$Zener probabilities. Furthermore, Rydberg interactions prolong the lifetime of Landau$-$Zener-induced excitations in the presence of weak dissipation and strong Rabi coupling. In contrast, for weak Rabi coupling, the Rydberg blockade inhibits excitation and suppresses the Landau$-$Zener transition probability.", "url": "https://arxiv.org/abs/2608.10639", "type": "理论+数值", "summary": "在这项工作中，我们研究了具有时间相关失谐的拉比耦合耗散里德堡晶格的激发动力学。使用 (i) 平均场近似内的 Lindblad 主方程和 (ii) 有效的非厄米哈密顿框架来分析系统。虽然平均场方法捕获了里德堡激发剖面中反铁磁序的出现，但非厄米描述提供了对复杂能谱及其避免交叉的直接洞察，这些交叉控制了朗道$-$齐纳动力学。我们确定了一种机制，其中子格子数量不平衡在避免的交叉点附近消失，从而导致两个子格子上具有相同的 Landau$-$Zener 概率。除了关键的有效封锁强度之外，还存在与另一种状态的动态交叉，其中亚晶格布居不平衡通过避免的交叉而持续存在，从而产生依赖于亚晶格的朗道$-$齐纳概率。此外，在弱耗散和强拉比耦合存在的情况下，里德伯相互作用延长了朗道$-$齐纳激发的寿命。\n\n相反，对于弱拉比耦合，里德堡封锁抑制激励并抑制朗道$-$齐纳跃迁概率。", "authors": [{"name": "Suvechha Indu"}, {"name": "Raka Dasgupta"}], "featured_authors": [{"name": "Suvechha Indu"}, {"name": "Raka Dasgupta"}], "author_count": 2}, {"id": "2608.10722", "category": "cond-mat", "title": "Two-component ultracold Bose gases with spin-orbit coupling", "abstract": "These lecture notes provide an introduction to Bose-Einstein condensates with Raman-induced spin-orbit coupling. Owing to the interplay between the peculiar single-particle dispersion, featuring a double-minimum structure, and the two-body interaction, these systems possess a complex phase diagram. Three different quantum phases can be observed, i.e., a stripe, a plane-wave, and a single-minimum phase, each characterized by different broken symmetries. The condensate dynamics is also significantly affected by the spin-orbit coupling, as revealed by the behavior of the Bogoliubov spectrum in infinite systems and the behavior of the discretized collective mode frequencies in trapped configurations, especially close to the phase transitions. In turn, the superfluid and rotational properties are also deeply modified by the coupling between the motional and spin degree of freedom. Finally, a special attention is devoted to the stripe phase and its supersolid character, which can be clearly revealed by the study of its dynamic features.", "url": "https://arxiv.org/abs/2608.10722", "type": "理论+数值", "summary": "这些讲义介绍了具有拉曼诱导自旋轨道耦合的玻色-爱因斯坦凝聚态。由于具有双最小结构的奇特单粒子分散体与两体相互作用之间的相互作用，这些系统具有复杂的相图。可以观察到三种不同的量子相，即条纹、平面波和单极小相，每种都具有不同的破缺对称性。凝聚态动力学也受到自旋轨道耦合的显着影响，正如无限系统中博戈留波夫谱的行为和俘获配置中离散集体模式频率的行为所揭示的那样，特别是在相变附近。反过来，超流体和旋转特性也通过运动自由度和自旋自由度之间的耦合而被深度修改。最后，特别关注条纹相及其超固体特征，这可以通过研究其动力学特征来清楚地揭示。", "authors": [{"name": "G. I. Martone"}, {"name": "S. Stringari"}], "featured_authors": [{"name": "G. I. Martone"}, {"name": "S. Stringari"}], "author_count": 2}, {"id": "2608.10735", "category": "cond-mat", "title": "Quantum Mechanism of Piezomagnetism in Higher-Spin Altermagnets", "abstract": "We investigate piezomagnetism in higher-spin altermagnets with easy-plane single-ion anisotropy using a flavor-wave approach. We show that quantum fluctuations of higher-spin collective modes provide a microscopic origin of the piezomagnetic response. For integer spins, the relevant branch softens and evolves into a Higgs-like amplitude mode on approaching the large-$D$ transition, endowing the excitation with a sizable dipolar component and producing a pronounced enhancement of piezomagnetism. By contrast, in half-integer systems the higher-spin branches are progressively separated from the low-energy dipolar sector as the anisotropy increases, which suppresses their contribution to the response. This integer-half-integer contrast directly links macroscopic piezomagnetism to the low-energy fate of multipolar excitations. Our results establish piezomagnetism as a probe of higher-spin quantum dynamics and identify higher-spin altermagnets as a promising setting for quantum magnetoelastic responses.", "url": "https://arxiv.org/abs/2608.10735", "type": "理论", "summary": "我们使用风味波方法研究具有易平面单离子各向异性的高自旋交变磁体中的压磁性。我们表明，高自旋集体模式的量子涨落提供了压磁响应的微观起源。对于整数自旋，相关分支在接近大$D$转变时软化并演变成类希格斯振幅模式，赋予激发相当大的偶极分量并产生压磁性的显着增强。相比之下，在半整数系统中，随着各向异性的增加，高自旋分支逐渐与低能偶极扇区分离，这抑制了它们对响应的贡献。这种整数-半整数对比将宏观压磁性与多极激发的低能命运直接联系起来。我们的结果将压磁学确立为高自旋量子动力学的探针，并将高自旋交变磁体确定为量子磁弹性响应的有希望的设置。", "authors": [{"name": "Daisuke Yamamoto"}, {"name": "Makoto Naka"}], "featured_authors": [{"name": "Daisuke Yamamoto"}, {"name": "Makoto Naka"}], "author_count": 2}, {"id": "2608.10747", "category": "cond-mat", "title": "Composite-Boson Ansatz for Fractional Quantum Hall Manifolds of Lattice Bosons at Generic Fillings $ν<1/2$", "abstract": "Hofstadter systems provide a lattice route to fractional quantum Hall physics, but their low-energy manifolds often lack simple wave-function descriptions. Here we present a composite-boson ansatz for a broad family of finite-size lattice-split Laughlin-quasihole manifolds in the low-flux Hofstadter--Bose--Hubbard model on a torus at generic fillings \\(\\nu<1/2\\). Attaching two vortices to each boson yields reduced-flux orbitals from which we construct a many-body trial basis. Its translation-resolved rank reproduces the expected low-energy-manifold dimension and provides a composite-boson interpretation of the established quasihole counting previously inferred from generalized exclusion rules and thin-torus arguments. For smaller systems, diagonalization within the lowest-band-projected ansatz span closely reproduces the exact projected spectrum, while variational Monte Carlo extends the rank and energetic analysis to larger systems for which explicit subspace construction becomes costly. To probe the fractional quantum Hall character of these manifolds, we calculate their many-body Chern-numbers and show that localized added-flux excitations exhibit quasihole-like behavior, with fractional density depletion and an Aharonov--Bohm-free braiding phase that both track the effective filling. Together, these results establish a microscopic composite-boson framework for organizing a broad family of sub-half-filled fractional quantum Hall manifolds of lattice bosons.", "url": "https://arxiv.org/abs/2608.10747", "type": "理论+数值", "summary": "霍夫施塔特系统为分数量子霍尔物理提供了一条晶格路线，但其低能流形通常缺乏简单的波函数描述。在这里，我们提出了一种复合玻色子模拟，用于在通用填充的环面上的低通量 Hofstadter-Bose-Hubbard 模型中的一系列有限尺寸晶格分裂 Laughlin 准孔流形 \\(\\nu<1/2\\)。将两个涡旋附加到每个玻色子上会产生通量减少的轨道，我们从中构建了多体试验基础。其平移解析等级再现了预期的低能量流形维度，并为先前从广义排除规则和薄环面论证中推断出的已建立的准空穴计数提供了复合玻色子解释。对于较小的系统，最低带投影 ansatz 跨度内的对角化可以紧密地再现精确的投影频谱，而变分蒙特卡罗将秩和能量分析扩展到较大的系统，对于这些系统，显式子空间构造变得昂贵。\n\n为了探究这些流形的分数量子霍尔特性，我们计算了它们的多体陈数，并表明局部附加通量激发表现出类准空穴行为，具有分数密度耗尽和阿哈罗诺夫-玻姆自由编织相，两者都跟踪有效填充。总之，这些结果建立了一个微观复合玻色子框架，用于组织晶格玻色子的亚半填充分数量子霍尔流形的广泛家族。", "authors": [{"name": "Umut Can Turhan"}, {"name": "A. Levent Subaşı"}, {"name": "Rifat Onur Umucalılar"}], "featured_authors": [{"name": "Umut Can Turhan"}, {"name": "A. Levent Subaşı"}, {"name": "Rifat Onur Umucalılar"}], "author_count": 3}, {"id": "2608.10759", "category": "cond-mat", "title": "Scalable Size- and Shape-Selective Purification of Colloidal Building Blocks via Excluded Volume Interactions", "abstract": "Excluded-volume interactions, arising solely from steric constraints, play a crucial role in determining the structure, dynamics, and phase behaviour of colloidal suspensions. This is particularly important for non-spherical particles, where orientation-dependent effects also become significant. In this study, we employ depletion-driven phase separation to develop a scalable, size-selective method for purifying spherical and non-spherical colloidal clusters that exhibit an interplay of concave and convex surface areas. Phase diagrams of charge-stabilised polystyrene spheres ranging in size from 267 to 1008 nm demonstrate that the mixing-demixing transition occurs across a range of surfactant concentrations rather than at a single threshold. Taking advantage of this transition width enables the purification of a single component from binary mixtures at size ratios as low as 1.6 in a single step. When the same approach is applied to tetrameric colloidal clusters, these are enriched fifteenfold relative to uncoordinated spheres. Importantly, the efficiency of sorting depends not only on the effective size but also on the geometry of the aggregate. For instance, anisotropic, weakly fused clusters separate more efficiently than spherical aggregates because their concave surface curvature is reduced compared to unfused clusters. These findings establish excluded-volume-driven sorting as a practical and scalable route for purifying colloidal building blocks for hierarchical assembly.", "url": "https://arxiv.org/abs/2608.10759", "type": "理论+数值", "summary": "仅由空间约束产生的排除体积相互作用在确定胶体悬浮液的结构、动力学和相行为方面发挥着至关重要的作用。这对于非球形颗粒尤其重要，其中方向相关的效应也变得显着。在这项研究中，我们采用耗尽驱动的相分离来开发一种可扩展的尺寸选择性方法，用于纯化表现出凹凸表面积相互作用的球形和非球形胶体簇。尺寸范围为 267 至 1008 nm 的电荷稳定聚苯乙烯球的相图表明，混合-分层转变发生在一系列表面活性剂浓度范围内，而不是在单一阈值处。利用这种过渡宽度，可以在一步中以低至 1.6 的尺寸比从二元混合物中纯化单一组分。当同样的方法应用于四聚体胶体簇时，它们相对于非配位球体富集了十五倍。重要的是，分选效率不仅取决于有效尺寸，还取决于骨料的几何形状。\n\n例如，各向异性的弱融合簇比球形聚集体分离更有效，因为与未融合簇相比，它们的凹面曲率减小了。这些发现将排除体积驱动的排序确立为一种实用且可扩展的途径，用于纯化分层组装的胶体构建块。", "authors": [{"name": "Thomas Kainz"}, {"name": "Isobel McSweeney"}, {"name": "Andrei-Micea Top"}, {"name": "Nicolas Bruder"}, {"name": "David J. Pine"}, {"name": "Andrea Dodero"}, {"name": "Ullrich Steiner"}], "featured_authors": [{"name": "Thomas Kainz"}, {"name": "Isobel McSweeney"}, {"name": "Andrei-Micea Top"}, {"name": "David J. Pine"}, {"name": "Andrea Dodero"}, {"name": "Ullrich Steiner"}], "author_count": 7}, {"id": "2608.10768", "category": "cond-mat", "title": "High-pressure electride superconductor Li5N for multifunctional applications: A theoretical insight into the physical properties", "abstract": "This study aims to unveil the physical properties of multifunctional Li5N electride under high pressure in the range of 150-350 GPa through first principles analysis within the density functional theory.", "url": "https://arxiv.org/abs/2608.10768", "type": "理论+数值", "summary": "本研究旨在通过密度泛函理论中的第一原理分析，揭示多功能Li5N电子化合物在150-350 GPa高压下的物理性质。", "authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "S.H. Naqib"}], "featured_authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "S.H. Naqib"}], "author_count": 2}, {"id": "2608.10862", "category": "cond-mat", "title": "Noise-Induced Localized Patterns in Excitable Media: Amplitude versus Persistence", "abstract": "Transient spatially localized activity underlies a broad range of biological processes, yet the statistical property of fluctuations that controls its nucleation remains unclear. We systematically investigate noise-induced dynamics in a spatially extended FitzHugh-Nagumo excitable system and identify three regimes: a quiescent phase, a spatially extended alternating phase, and a pattern-forming phase characterized by transient localized excitation patches. Surprisingly, we find that temporal noise correlations are not required for patch formation: Gaussian white noise produces localized patches when its amplitude is sufficiently large, whereas weaker fluctuations can achieve the same effect when temporal correlations allow them to persist. Our results identify the instantaneous amplitude and the persistence as joint stochastic control parameters for transient pattern formation in excitable media. These distinct quantities are linked through the integrated noise strength, which quantifies the accumulated stochastic forcing available to nucleate an excitation. In addition, the inhibitor response time subsequently determines whether the excitation remains localized or spreads throughout the system.", "url": "https://arxiv.org/abs/2608.10862", "type": "理论", "summary": "瞬态空间局部活动是广泛生物过程的基础，但控制其成核的波动的统计特性仍不清楚。我们系统地研究了空间扩展的 FitzHugh-Nagumo 可兴奋系统中噪声引起的动力学，并确定了三种状态：静止阶段、空间扩展的交替阶段和以瞬态局部激励斑块为特征的模式形成阶段。令人惊讶的是，我们发现斑块的形成不需要时间噪声相关性：当高斯白噪声的幅度足够大时，它会产生局部斑块，而当时间相关性允许它们持续存在时，较弱的波动可以达到相同的效果。我们的结果将瞬时幅度和持久性确定为可兴奋介质中瞬态模式形成的联合随机控制参数。这些不同的量通过积分噪声强度联系起来，积分噪声强度量化了可用于激发激发的累积随机力。\n\n此外，抑制剂响应时间随后决定激励是保持局部还是扩散到整个系统。", "authors": [{"name": "Chau Dao"}, {"name": "Jr-Ming Yang"}, {"name": "Chuan-Hsiang Huang"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Chau Dao"}, {"name": "Jr-Ming Yang"}, {"name": "Chuan-Hsiang Huang"}, {"name": "Gia-Wei Chern"}], "author_count": 4}, {"id": "2608.10868", "category": "cond-mat", "title": "Analytical Theory for Anomalous Diffusion in the Anderson Model with Heavy Tails", "abstract": "We develop an analytical theory of anomalous transport in a noninteracting Anderson model with heavy-tailed hopping amplitudes. The broad distribution of hopping amplitudes gives rise to an extended intermediate-time regime with a subdiffusive effective exponent, despite the absence of interactions or genuine many-body effects. By solving the transport equations analytically, we derive the time dependence of the mean-square displacement and identify a continuous crossover from an intermediate anomalous regime to asymptotically diffusive transport. As the localization transition is approached, the spatial extent of the subdiffusive window diverges parametrically, while the crossover to conventional diffusion remains finite in units of $\\Gamma_0^{-1}$. This produces an increasingly broad anomalous transport regime in space that can closely resemble Griffiths-type transport observed near the many-body localization transition. Our results demonstrate that rare hopping processes alone provide a microscopic single-particle mechanism for robust transport anomalies, establishing an analytical benchmark for distinguishing interaction-induced effects from disorder-driven dynamics.", "url": "https://arxiv.org/abs/2608.10868", "type": "理论", "summary": "我们在具有重尾跳跃幅度的非相互作用安德森模型中开发了异常传输的分析理论。尽管不存在相互作用或真正的多体效应，但跳跃幅度的广泛分布导致了具有次扩散有效指数的延长的中间时间范围。通过分析求解输运方程，我们推导了均方位移的时间依赖性，并确定了从中间异常状态到渐近扩散输运的连续交叉。当接近定位转变时，次扩散窗口的空间范围参数地发散，而与传统扩散的交叉仍然以 $\\Gamma_0^{-1}$ 为单位有限。这在空间中产生了越来越广泛的异常输运机制，与在多体定位转变附近观察到的格里菲斯型输运非常相似。我们的结果表明，罕见的跳跃过程本身就为稳健的传输异常提供了微观单粒子机制，为区分相互作用引起的效应与无序驱动的动力学建立了分析基准。", "authors": [{"name": "Elizaveta Safonova"}, {"name": "Aleksey Lunkin"}, {"name": "Mikhail Feigel'man"}], "featured_authors": [{"name": "Elizaveta Safonova"}, {"name": "Aleksey Lunkin"}, {"name": "Mikhail Feigel'man"}], "author_count": 3}, {"id": "2608.10902", "category": "cond-mat", "title": "Oscillation modes of skyrmion strings in a ferromagnetic film", "abstract": "It is shown that a skyrmion string in a ferromagnetic film consisting of $N$ atomic layers exhibits flexural oscillations at eigenfrequencies $|\\omega_{m}|=(4J'S/\\hbar)\\sin^{2}[\\pi m/(2N)]$, where $J'$ is the interlayer exchange coupling, $S$ is the length of the atomic spin, and $m=1,...,N-1$. This result is confirmed numerically for individual skyrmion strings in a discrete microscopic spin-lattice model of up to ten atomic layers, as well as for skyrmion-string lattices at finite temperature.", "url": "https://arxiv.org/abs/2608.10902", "type": "理论+数值", "summary": "结果表明，由 $N$ 原子层组成的铁磁薄膜中的斯格明子弦在特征频率 $|\\omega_{m}|=(4J'S/\\hbar)\\sin^{2}[\\pi m/(2N)]$ 处表现出弯曲振荡，其中 $J'$ 是层间交换耦合，$S$ 是原子自旋长度，$m=1,...,N-1$。这一结果在多达十个原子层的离散微观自旋晶格模型中的单个斯格明子弦以及有限温度下的斯格明子弦晶格中得到了数值证实。", "authors": [{"name": "Eugene M. Chudnovsky"}, {"name": "Dmitry A. Garanin"}], "featured_authors": [{"name": "Eugene M. Chudnovsky"}, {"name": "Dmitry A. Garanin"}], "author_count": 2}, {"id": "2608.10948", "category": "cond-mat", "title": "Steady-state phase transition in one-dimensional hybrid contact process", "abstract": "We investigate the steady-state phase transition in a one-dimensional hybrid contact process. We implement the single-site and cluster mean-field approximations based on the effective fields and present all the possible steady states of the system. We show the existence of the stable absorbing and active phases, and the bistable region in the long-time limit. The saddle-node bifurcation is observed at the boundary between the absorbing phase and the bistable region, suggesting a discontinuous phase transition. While the absorbing to active phase transition is continuous. To characterize the nonclassical scaling behavior of the continuous phase transition, we extract the true critical points and exponents by means of the coherent anomaly method.", "url": "https://arxiv.org/abs/2608.10948", "type": "理论", "summary": "我们研究一维混合接触过程中的稳态相变。我们基于有效场实现了单点和簇平均场近似，并呈现了系统所有可能的稳态。我们证明了稳定吸收相和活性相的存在，以及长期极限内的双稳态区域。在吸收相和双稳态区域之间的边界处观察到鞍结分岔，表明相变不连续。而吸收到活性的相变是连续的。为了表征连续相变的非经典标度行为，我们通过相干异常方法提取真实的临界点和指数。", "authors": [{"name": "Lin Shang"}, {"name": "Shuai Geng"}, {"name": "Xingli Li"}, {"name": "Jiasen Jin"}], "featured_authors": [{"name": "Lin Shang"}, {"name": "Shuai Geng"}, {"name": "Xingli Li"}, {"name": "Jiasen Jin"}], "author_count": 4}, {"id": "2608.10958", "category": "cond-mat", "title": "Spin Splitter without Spin-Split Bands: A Reconfigurable Altermagnetic Texture", "abstract": "The altermagnetic spin-splitter effect converts an electric field into a transverse pure spin current, with no net magnetization and no charge-Hall counterpart. In established materials this function is tied to crystal-fixed spin-split bands that lock the polarization axis to the lattice. We show that the noncoplanar counter-spiral ground state of a frustrated honeycomb magnet instead carries the altermagnetic operation through a $\\mathbf Q$-locked helicity mirror $g$. The mirror selects the spin-current polarization and forbids the perpendicular one, while an antitranslation $\\Theta$ forbids even-parity spin splitting. Band splitting and spin-splitter response therefore rest on different symmetry elements. Either element alone enforces the charge-Hall zero---a redundancy absent from other spin--orbit-free noncollinear routes---and a charge Hall appears only when both elements are removed. Hole doping then realizes a \\emph{spin splitter without spin-split bands}---the symmetry-allowed odd-parity residual below $2\\times10^{-7}$ of the hopping $t$ at the Fermi level---with $\\sigma_H^{(s_y)}=0.082\\,e^2/h$ without spin--orbit coupling and with zero charge Hall response. Selecting among the three degenerate $\\mathbf{Q}$ orientations rotates the polarization axis in exact $120^\\circ$ steps at fixed magnitude and charge-Hall zero; the selection rules persist in a $32$-site cell accessible to programmable photonic and circuit lattices.", "url": "https://arxiv.org/abs/2608.10958", "type": "理论", "summary": "交变磁自旋分离器效应将电场转换为横向纯自旋电流，没有净磁化，也没有电荷霍尔对应物。在已建立的材料中，该功能与晶体固定的自旋分裂带有关，该带将偏振轴锁定在晶格上。我们证明了受抑蜂窝磁体的非共面反螺旋基态通过 $\\mathbf Q$ 锁定的螺旋镜 $g$ 进行交变磁操作。镜子选择自旋流偏振并禁止垂直偏振，而反平移$\\Theta$则禁止偶宇称自旋分裂。因此，能带分裂和自旋分裂响应依赖于不同的对称元素。任一元件单独强制电荷霍尔为零——其他自旋轨道非共线路线中不存在的冗余——并且仅当两个元件都被移除时电荷霍尔才会出现。然后，空穴掺杂实现了一个\\emph{没有自旋分裂能带的自旋分裂器}——费米能级上跳跃$t$的对称性允许的奇宇称残差低于$2\\times10^{-7}$——$\\sigma_H^{(s_y)}=0.082\\,e^2/h$，没有自旋轨道耦合和零电荷霍尔响应。\n\n在三个简并 $\\mathbf{Q}$ 方向中进行选择，以固定幅度和电荷霍尔为零的精确 $120^\\circ$ 步长旋转偏振轴；选择规则保留在可访问可编程光子和电路晶格的 32 美元站点单元中。", "authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Qiang Luo"}, {"name": "Ken Chen"}, {"name": "Jia-Wei Mei"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "featured_authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Qiang Luo"}, {"name": "Jia-Wei Mei"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "author_count": 7}, {"id": "2608.11004", "category": "cond-mat", "title": "Influence of interactions on the chiral effect in $1D$ Dirac semimetal", "abstract": "We consider the 1D Su-Schrieffer-Heeger (SSH) model. It was recently shown that, for the noninteracting model in its Dirac semimetal phase, the linear response of the axial charge density to an external electric field is proportional to the electrical conductivity in the presence of finite dissipation, with the proportionality factor determined by the coupling constants. This relation may be viewed as a manifestation of the chiral effect, which is a dimensional reduction of the 3D chiral magnetic effect. In the present work, we investigate the same model in the presence of two versions of local Hubbard-type interactions using numerical Quantum Monte Carlo simulations. We find, within the numerical resolution and for the parameters studied, that, even in the regime where sufficiently strong interactions drive the system into a Mott insulating phase, the proportionality between the induced axial charge density and the electrical conductivity remains unchanged. This result indicates that the chiral effect is not renormalized by local Hubbard interactions.", "url": "https://arxiv.org/abs/2608.11004", "type": "理论+数值", "summary": "我们考虑一维 Su-Schrieffer-Heeger (SSH) 模型。最近的研究表明，对于狄拉克半金属相的非相互作用模型，在有限耗散的情况下，轴向电荷密度对外部电场的线性响应与电导率成正比，比例因子由耦合常数决定。这种关系可以被视为手性效应的表现，它是 3D 手性磁效应的降维。在目前的工作中，我们使用数值量子蒙特卡罗模拟研究存在两个版本的局部哈伯德型相互作用的同一模型。我们发现，在数值分辨率和所研究的参数范围内，即使在足够强的相互作用驱动系统进入莫特绝缘相的情况下，感应轴向电荷密度和电导率之间的比例也保持不变。该结果表明手性效应并未通过局部哈伯德相互作用重新归一化。", "authors": [{"name": "Maksim Ulybyshev"}, {"name": "M.A.Zubkov"}], "featured_authors": [{"name": "Maksim Ulybyshev"}, {"name": "M.A.Zubkov"}], "author_count": 2}, {"id": "2608.11021", "category": "cond-mat", "title": "Universal scaling of spatially extended zero modes in inhomogeneous SSH chains", "abstract": "Protected zero modes are a hallmark of topological phases of matter and are exponentially localized at sharp interfaces between distinct gapped phases. We investigate how this picture changes for smooth interfaces in a broad class of inhomogeneous Su-Schrieffer-Heeger (SSH) models. Combining an exact lattice solution with an inhomogeneous Dirac description, we show that the associated Jackiw-Rebbi zero mode becomes spatially extended. For arbitrary smooth hopping profiles, its lattice extension universally scales as the square root of the system size, independently of the microscopic details of the interface. This emergent length defines a mesoscopic critical region separating two gapped phases, within which correlations decay algebraically before crossing over to exponential decay. In addition, the entanglement entropy scales as the logarithm of the emergent length near the interface, confirming the interpretation of a mesoscopic critical region. Our results establish a universal critical length governing the low-energy physics of smooth topological interfaces.", "url": "https://arxiv.org/abs/2608.11021", "type": "理论", "summary": "受保护的零模式是物质拓扑相的标志，并且以指数方式定位在不同间隙相之间的尖锐界面处。我们研究了在一系列非齐次 Su-Schrieffer-Heeger (SSH) 模型中，平滑界面的情况如何变化。将精确晶格解与非齐次狄拉克描述相结合，我们证明了相关的 Jackiw-Rebbi 零模在空间上扩展。对于任意平滑的跳跃分布，其晶格延伸普遍缩放为系统尺寸的平方根，与界面的微观细节无关。该涌现长度定义了分隔两个带隙相的介观临界区域，在该区域内相关性在交叉到指数衰减之前以代数方式衰减。此外，纠缠熵与界面附近的出现长度的对数成正比，证实了介观临界区域的解释。我们的结果建立了控制光滑拓扑界面的低能物理的通用临界长度。", "authors": [{"name": "Gilles Parez"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Gilles Parez"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Luc Vinet"}], "author_count": 5}, {"id": "2608.11039", "category": "cond-mat", "title": "Boundary-layer analysis of the partial engulfment of a small particle by a lipid membrane", "abstract": "We study the axisymmetric partial engulfment of a small rigid sphere by a fluid Helfrich membrane. When the size ratio $\\eps$ between the particle and the membrane is small, the neck that joins the wrapped cap to the surrounding membrane is an elastic boundary layer, and we analyse it by matched asymptotic expansions. The leading inner surface is a catenoid, a minimal surface that stores no Helfrich energy, so that the energy of partial engulfment is carried by the first correction and appears only at order $\\eps^{2}\\ln(1/\\eps)$. We obtain it by solving the inhomogeneous Jacobi equation of the catenoid, forced by the spontaneous curvature and by the ambient mean curvature that the neck must match, and we give its coefficient in closed form. The boundary layer can then be integrated out, and the neck replaced by a scalar self-energy carried at the pole, so that the outer field can be closed independently of the inner one. For a membrane coupled to a tension reservoir we derive the binding threshold, which turns out to be independent of both the tension and the spontaneous curvature, the complete-wrapping threshold, and the hysteresis of the envelopment transition. The neck self-energy law is confirmed against the full nonlinear shape equations.", "url": "https://arxiv.org/abs/2608.11039", "type": "理论", "summary": "我们研究了流体 Helfrich 膜对小刚性球体的轴对称部分吞没。当颗粒与膜之间的尺寸比 $\\eps$ 较小时，将包裹的帽与周围膜连接起来的颈部是弹性边界层，我们通过匹配渐近膨胀对其进行分析。主要内表面是悬链线，是不存储 Helfrich 能量的最小表面，因此部分吞没的能量由第一次修正携带，并且仅出现在 $\\eps^{2}\\ln(1/\\eps)$ 阶上。我们通过求解悬链线的非齐次雅可比方程（受到颈部必须匹配的自发曲率和环境平均曲率的强制）来获得它，并以封闭形式给出其系数。然后边界层可以被积分出来，颈部被极点携带的标量自能所取代，这样外部场可以独立于内部场而闭合。对于耦合到张力储存器的膜，我们推导出结合阈值，该阈值与张力和自发曲率、完全包裹阈值以及包络转变的滞后无关。\n\n颈部自能定律根据完全非线性形状方程得到证实。", "authors": [{"name": "Gaetano Napoli"}], "featured_authors": [{"name": "Gaetano Napoli"}], "author_count": 1}, {"id": "2608.11041", "category": "cond-mat", "title": "Jamming transition in an active exclusion process", "abstract": "Multiple studies on active matter have shown that activity can induce or suppress a phase transition, or modify the critical behavior of a passive system. Here we investigate how activity affects the jamming transition which is a paradigmatic example of nonequilibrium phase transitions in passive systems. We consider a one-dimensional system of active particles with hardcore interactions and a direction of self-propulsion which can be reversed at a given switching rate. For a class of particle hop rates and infinite switching rate, our model reduces to a passive system which is known to exhibit a transition between a high-density fluid phase and a low-density jammed phase in the stationary state. Using Monte Carlo simulations and a mean field theory, we study how the mean mobility of the particle and the hole cluster distribution vary with density and finite switching rate. Our main result is that activity hinders the formation of jam and can even inhibit it; more precisely, we find that the jamming transition occurs at a critical density that decreases with decreasing switching rate, and at sufficiently small switching rate, the system exists only in the fluid phase.", "url": "https://arxiv.org/abs/2608.11041", "type": "理论+数值", "summary": "对活性物质的多项研究表明，活性可以诱导或抑制相变，或改变被动系统的关键行为。在这里，我们研究活动如何影响干扰转变，这是无源系统中非平衡相变的典型例子。我们考虑一个由具有核心相互作用的活性粒子组成的一维系统，以及可以在给定切换速率下反转的自推进方向。对于一类粒子跳跃率和无限切换率，我们的模型简化为被动系统，已知该系统在静止状态下表现出高密度流体相和低密度堵塞相之间的转变。使用蒙特卡罗模拟和平均场理论，我们研究了粒子的平均迁移率和空穴簇分布如何随密度和有限切换率变化。我们的主要结果是，活动阻碍甚至抑制果酱的形成；更准确地说，我们发现干扰转变发生在临界密度处，该临界密度随着切换速率的降低而降低，并且在足够小的切换速率下，系统仅存在于流体相中。", "authors": [{"name": "Kavita Jain"}, {"name": "Sakuntala Chatterjee"}], "featured_authors": [{"name": "Kavita Jain"}, {"name": "Sakuntala Chatterjee"}], "author_count": 2}, {"id": "2608.11073", "category": "cond-mat", "title": "A Dynamical Mechanism for Irreversibility in Cyclically Driven Amorphous Solids", "abstract": "Amorphous solids subjected to athermal quasistatic oscillatory shear undergo a transition from periodic reversible dynamics to irreversible diffusive dynamics at yielding. How irreversibility arises in such deterministic, dissipative dynamics remains unclear. Here we show that trajectories remain locally stable, with perturbations decaying rather than growing even in the irreversible regime, ruling out the sustained exponential sensitivity to initial conditions associated with chaotic dynamics. Rather than diverging continuously, nearby trajectories initially remain close before eventually separating through rare branching events, after which their separation grows diffusively. A mean-field soft-spot model reproduces the same branching statistics and reveals their microscopic origin. We find that branching originates from competition between nearly-degenerate plastic instabilities, in which a small perturbation changes which instability activates first and thereby alters the subsequent sequence of plastic events. These results identify instability-selection-induced branching as a dynamical mechanism for irreversibility in cyclically driven amorphous solids.", "url": "https://arxiv.org/abs/2608.11073", "type": "理论", "summary": "受到非热准静态振荡剪切的无定形固体在屈服时经历从周期性可逆动力学到不可逆扩散动力学的转变。在这种确定性的耗散动力学中，不可逆性是如何产生的仍不清楚。在这里，我们证明轨迹保持局部稳定，即使在不可逆状态下，扰动也会衰减而不是增长，从而排除了与混沌动力学相关的初始条件的持续指数敏感性。附近的轨迹不是连续发散，而是最初保持接近，然后通过罕见的分支事件最终分离，此后它们的分离扩散地增长。平均场软点模型再现了相同的分支统计数据并揭示了它们的微观起源。我们发现分支起源于近简并塑性不稳定性之间的竞争，其中一个小的扰动会改变首先激活的不稳定性，从而改变随后的塑性事件顺序。这些结果将不稳定性选择诱导的支化确定为循环驱动的非晶固体不可逆性的动力学机制。", "authors": [{"name": "Sauvik Chatterjee"}, {"name": "Asaf Szulc"}, {"name": "Ido Regev"}], "featured_authors": [{"name": "Sauvik Chatterjee"}, {"name": "Asaf Szulc"}, {"name": "Ido Regev"}], "author_count": 3}, {"id": "2608.11104", "category": "cond-mat", "title": "Exact Expressions of Entropy for Classical Non-interacting Many-body Systems", "abstract": "In the thermodynamic limit, the equilibrium state of a many-body system can be characterized by three pairs of conjugate thermodynamic variables: $E/T,V/P,N/\\mu$. In this limit, the thermodynamic properties in all ensembles are equivalent up to the leading order of $E,V,N$. However, for systems of finite size, this ensemble equivalence is no longer exact, and the thermodynamic properties may differ substantially among ensembles. To quantify these finite-size effects rigorously, it is desirable to develop a universal ensemble theory applicable to systems of arbitrary size, providing exact expressions for entropy and, thereby, giving rise to the precise value of all equilibrium thermodynamic quantities. In this work, we propose a theory that determines the exact entropy expressions for classical non-interacting many-body systems of arbitrary size across all statistical ensembles, based on only two postulates: \\textbf{stationarity}, requiring that the physical laws be invariant under time translation, and \\textbf{unbiasedness}, requiring that the equilibrium mixed state maximize the entropy subject to the prescribed constraints. Moreover, we show that the entropy expressions obtained in different ensembles converge to the common asymptotic form $S \\asymp \\ln\\!\\left( \\left( \\frac{4\\pi m e E}{3N} \\right)^{3N/2} \\cdot \\left(\\frac{V}{N}\\right)^N \\right)+N$, consistent with the predictions of the large deviation theory.", "url": "https://arxiv.org/abs/2608.11104", "type": "理论", "summary": "在热力学极限下，多体系统的平衡状态可以用三对共轭热力学变量来表征：$E/T,V/P,N/\\mu$。在此限制下，所有系综中的热力学性质都相当于 $E,V,N$ 的主阶。然而，对于有限尺寸的系统，这种系综等价不再精确，并且系综之间的热力学性质可能存在很大差异。为了严格量化这些有限尺寸效应，需要开发一种适用于任意尺寸系统的通用系综理论，提供熵的精确表达式，从而得出所有平衡热力学量的精确值。在这项工作中，我们提出了一种理论，确定所有统计集合中任意大小的经典非相互作用多体系统的精确熵表达式，仅基于两个假设：\\textbf{平稳性}，要求物理定律在时间平移下不变；和\\textbf{无偏性}，要求平衡混合状态在规定的约束下最大化熵。\n\n此外，我们发现不同系综中获得的熵表达式收敛于共同的渐近形式 $S \\asymp \\ln\\!\\left( \\left( \\frac{4\\pi m e E}{3N} \\right)^{3N/2} \\cdot \\left(\\frac{V}{N}\\right)^N \\right)+N$，与大偏差理论的预测一致。", "authors": [{"name": "Yuheng Wu"}, {"name": "Henrik Heelweg"}, {"name": "Rigel Galgana"}], "featured_authors": [{"name": "Yuheng Wu"}, {"name": "Henrik Heelweg"}, {"name": "Rigel Galgana"}], "author_count": 3}, {"id": "2608.11184", "category": "cond-mat", "title": "Microscopic derivation of a field equation for active Brownian particles", "abstract": "To understand the phenomena displayed in active phase separation, general top-down theories like Active Model B+ (AMB+) add fluxes that break time reversal symmetry. Starting from an Enskog-like kinetic theory of hard-core active Brownian particles in the high persistence regime, we derive AMB+ from first principles. For the effective free energy to have two minima, we propose an effective parametrization of the pair correlation function. Explicit expressions for all coefficients in the model are given as a function of the microscopic parameters to leading order in the Péclet number.", "url": "https://arxiv.org/abs/2608.11184", "type": "理论", "summary": "为了理解主动相分离中显示的现象，一般自上而下的理论（例如主动模型 B+ (AMB+)）添加了打破时间反转对称性的通量。从高持久性状态下硬核活性布朗粒子的类 Enskog 动力学理论出发，我们从第一原理推导出 AMB+。为了使有效自由能具有两个最小值，我们提出了对相关函数的有效参数化。模型中所有系数的显式表达式均作为佩克莱数中前导阶微观参数的函数给出。", "authors": [{"name": "Martín Pinto-Goldberg"}, {"name": "Rodrigo Soto"}], "featured_authors": [{"name": "Martín Pinto-Goldberg"}, {"name": "Rodrigo Soto"}], "author_count": 2}, {"id": "2608.11186", "category": "cond-mat", "title": "Skin-Anderson Localization Transition in Strongly Coupled Disordered Non-Hermitian Chains", "abstract": "The interplay between disorder and non-Hermitian effects gives rise to a variety of intriguing localization phenomena. While disorder tends to localize the eigenstates through Anderson localization, non-Hermitian non-reciprocity promotes the formation of skin modes by driving the eigenstates toward the system boundaries giving rise to non-Hermitian skin effect (NHSE). In this work, we investigate the interplay between these competing mechanisms in a two-leg ladder consisting of a Hatano-Nelson chain coupled to a Hermitian chain via asymmetric inter-chain hopping, with strong disorder present in both chains. We show that tuning the asymmetry of the inter-chain coupling induces successive transitions in the nature of the eigenstates, from skin localization to Anderson localization and subsequently back to skin localization. Remarkably, the non-Hermitian skin effect re-emerges even though the energy spectrum exhibits a line-gap topology, demonstrating that robust skin localization can persist beyond the conventional point-gap regime.", "url": "https://arxiv.org/abs/2608.11186", "type": "理论", "summary": "无序效应和非厄米效应之间的相互作用产生了各种有趣的局域化现象。虽然无序倾向于通过安德森定位来定位本征态，但非厄米非互易性通过将本征态驱动到系统边界来促进趋肤模式的形成，从而产生非厄米趋肤效应（NHSE）。在这项工作中，我们研究了双腿梯子中这些竞争机制之间的相互作用，该双腿梯子由通过不对称链间跳跃耦合到埃尔米特链的 Hatano-Nelson 链组成，两条链中都存在强烈的无序性。我们表明，调整链间耦合的不对称性会导致本征态性质的连续转变，从皮肤定位到安德森定位，然后回到皮肤定位。值得注意的是，即使能谱表现出线隙拓扑，非厄米趋肤效应也会重新出现，这表明稳健的趋肤定位可以持续超出传统的点隙状态。", "authors": [{"name": "S Rahul"}], "featured_authors": [{"name": "S Rahul"}], "author_count": 1}, {"id": "2608.11189", "category": "cond-mat", "title": "Floquet Green's functions for lattice electrons driven by Gaussian quantum light", "abstract": "We formulate Floquet Green's functions for noninteracting single-band lattice electrons driven by a reservoir-stabilized single-mode Gaussian quantum light source. The source is prescribed externally and is not updated by the many-electron polarization, while an active electronic probe still conditions the source evolution through the Peierls coupling. The two time arguments of a Green's function share one source history: the lesser and greater components are obtained by convolving a shared-history four-endpoint kernel with the continuous bath kernels before the final source trace, while the bath canonical anticommutation relation yields an equal-time covariance that seeds the retarded and advanced one-leg propagations. The Peierls coupling is treated nonperturbatively within the prescribed-source model, and classical Floquet theory is recovered in the appropriate limit. Numerical calculations on a minimal one-dimensional model show finite-coupling quantum-source corrections beyond a prescribed classical drive, together with spectral reconstruction and occupancy redistribution for squeezed vacuum and squeezed coherent sources. The squeezing parameter and phase provide additional control knobs, beyond classical amplitude modulation, for both sideband structure and occupied weight. This work provides a theoretical framework for quantum Floquet engineering of condensed matter with an externally prescribed quantum light source.", "url": "https://arxiv.org/abs/2608.11189", "type": "理论+数值", "summary": "我们为由储库稳定单模高斯量子光源驱动的非相互作用单带晶格电子制定了 Floquet Green 函数。源是外部指定的，并且不会通过多电子极化进行更新，而有源电子探针仍然通过 Peierls 耦合来调节源的演化。格林函数的两个时间参数共享一个源历史：较小和较大的分量是通过将共享历史四端点内核与最终源跟踪之前的连续浴内核进行卷积而获得的，而浴规范反交换关系产生一种等时协方差，该协方差为迟缓和先进的单腿传播提供种子。 Peierls 耦合在指定源模型内进行非微扰处理，并在适当的限制内恢复经典的 Floquet 理论。最小一维模型的数值计算显示超出规定经典驱动的有限耦合量子源校正，以及压缩真空和压缩相干源的光谱重建和占用重新分布。\n\n除了经典的幅度调制之外，压缩参数和相位还为边带结构和占用重量提供了额外的控制旋钮。这项工作为使用外部规定的量子光源进行凝聚态物质的量子 Floquet 工程提供了理论框架。", "authors": [{"name": "Atsushi Ono"}], "featured_authors": [{"name": "Atsushi Ono"}], "author_count": 1}, {"id": "2608.11192", "category": "cond-mat", "title": "Floquet Engineering of Topological Phases and Magneto-Optical Response in a Driven $d$-wave Altermagnet", "abstract": "We study how Floquet driving with linearly polarized light controls the topology and magneto-optical response of a two-dimensional (2D) $d$-wave altermagnet. In the absence of linearly polarized optical field and under spin conservation, we find that the system hosts a spin-Chern (a quantum-spin-Hall analog) phase with Chern numbers of opposite sign in the two spin sectors. The irradiated optical field breaks the $C_{4z}\\mathcal{T}$ crystalline antiunitary symmetry between the spin sectors. Symmetry breaking originates from polarization-dependent Peierls phases, which renormalize hopping anisotropically along the two axes. The resulting spin-selective gap closures produce intermediate Chern-insulating phases with $C=\\pm1$. The drive amplitude $A_0$ determines the inversion thresholds, while rotating the polarization by $\\pi/2$ swaps the spin sectors and reverses the Chern number. Using the Kubo formalism, we compute the frequency-dependent longitudinal and Hall conductivities and derive the corresponding Faraday and Kerr rotations for a free-standing conducting sheet. The longitudinal response tracks the Floquet-renormalized interband thresholds, whereas the optical Hall response, together with the sign of the magneto-optical rotations, distinguishes the two opposite Berry-curvature chiralities. Sizable Kerr angles occur only within narrow resonant windows and should be interpreted together with the reflected intensity and Kerr ellipticity. These results identify linearly polarized light as a symmetry-selective handle for spin-resolved band inversion, Chern-number switching, and contact-free optical detection in $d$-wave altermagnets.", "url": "https://arxiv.org/abs/2608.11192", "type": "理论+数值", "summary": "我们研究了 Floquet 线性偏振光驱动如何控制二维 (2D) $d$ 波交变磁体的拓扑和磁光响应。在没有线性偏振光场和自旋守恒的情况下，我们发现该系统具有自旋陈（量子自旋霍尔模拟）相，两个自旋扇区中的陈数具有相反的符号。照射光场打破了自旋扇区之间的 $C_{4z}\\mathcal{T}$ 晶体反统一对称性。对称性破缺源自偏振相关的 Peierls 相，它沿两个轴各向异性地重新规范化跳跃。由此产生的自旋选择性间隙闭合产生中间陈绝缘相 $C=\\pm1$。驱动幅度 $A_0$ 确定反转阈值，而将偏振旋转 $\\pi/2$ 会交换自旋扇区并反转陈数。使用久保形式主义，我们计算了频率相关的纵向电导率和霍尔电导率，并导出了独立式导电片的相应法拉第和克尔旋转。\n\n纵向响应跟踪 Floquet 重整化带间阈值，而光学霍尔响应与磁光旋转的符号一起区分两个相反的贝里曲率手性。相当大的克尔角仅出现在狭窄的共振窗口内，并且应与反射强度和克尔椭圆率一起解释。这些结果表明，线偏振光可作为 d$ 波交替磁体中自旋分辨能带反转、陈数转换和非接触式光学检测的对称选择手柄。", "authors": [{"name": "Muzamil Shah"}], "featured_authors": [{"name": "Muzamil Shah"}], "author_count": 1}, {"id": "2608.11202", "category": "cond-mat", "title": "Exact First-Passage Time Response Theory from Steady-State Response", "abstract": "The mean first-passage time (MFPT) provides a universal temporal measure of transport, reaction, search, and switching processes in physical, chemical, and biological systems. Understanding how MFPTs respond to perturbations is therefore crucial for prediction and control, yet a systematic theory has been lacking. We establish a compact theoretical framework for linear and nonlinear MFPT response in continuous-time Markov processes. The key tool is an exact correspondence that maps the intrinsically transient response of MFPTs onto the steady-state response of an auxiliary system. This correspondence yields exact and universal response relations for MFPTs between arbitrary state pairs, expressed entirely in terms of unperturbed MFPTs and steady-state probabilities. We then obtain a factorized physical decomposition of the MFPT response into linear upstream, linear downstream, and nonlinear contributions. Further corollaries include response-curve inference rules, fundamental bounds on MFPT responses, analytical expressions for higher-order responses of MFPTs and steady-state probabilities, and multi-rate response formulas. Additionally, our result offers computational advantages in calculating both MFPTs and steady-state distributions. Finally, a biologically motivated folding network is analyzed, and a recently reported paradox on MFPT is clarified.", "url": "https://arxiv.org/abs/2608.11202", "type": "理论", "summary": "平均首次通过时间 (MFPT) 提供了物理、化学和生物系统中传输、反应、搜索和转换过程的通用时间测量。因此，了解 MFPT 如何响应扰动对于预测和控制至关重要，但一直缺乏系统的理论。我们为连续时间马尔可夫过程中的线性和非线性 MFPT 响应建立了一个紧凑的理论框架。关键工具是一种精确的对应关系，它将 MFPT 的固有瞬态响应映射到辅助系统的稳态响应。这种对应关系产生任意状态对之间 MFPT 的精确且通用的响应关系，完全用未扰动的 MFPT 和稳态概率来表示。然后，我们将 MFPT 响应分解为线性上游、线性下游和非线性贡献的物理分解。进一步的推论包括响应曲线推理规则、MFPT 响应的基本界限、MFPT 高阶响应的分析表达式和稳态概率以及多速率响应公式。\n\n此外，我们的结果在计算 MFPT 和稳态分布方面具有计算优势。最后，分析了生物驱动的折叠网络，并澄清了最近报道的 MFPT 悖论。", "authors": [{"name": "Ruicheng Bao"}, {"name": "Shiling Liang"}], "featured_authors": [{"name": "Ruicheng Bao"}, {"name": "Shiling Liang"}], "author_count": 2}, {"id": "2608.10009", "category": "hep-th", "title": "Casimir Force in Spacetimes with Torsion", "abstract": "We compute the Casimir force between perfectly conducting parallel plates in a spacetime endowed with constant axial torsion. Working within an effective field theory framework where torsion couples to the electromagnetic sector via a gauge-invariant Chern--Simons-type interaction, we derive the modified photon dispersion relation and mode spectrum. Using zeta-function regularization, we obtain the vacuum energy and the resulting Casimir pressure to second order in the torsion parameter. Our calculation yields a correction scaling as $\\Delta P/P_0 = -\\frac{5\\xi^2 S_z^2 a^2}{4\\pi^2} + \\order(S_z^4)$, which corresponds to a slight weakening of the attractive Casimir force. We acknowledge a known subtlety in the literature: because the Chern-Simons interaction is a total derivative, some analyses conclude that it should not contribute to the Casimir energy for standard boundary conditions, implying the leading correction is of higher order, $\\order(S_z^4)$. For experimentally accessible plate separations ($a \\sim \\qty{1}{\\micro\\meter}$), the effect remains well below current detection thresholds ($|\\Delta P/P_0| \\lesssim 10^{-30}$) due to stringent bounds on macroscopic torsion from spin-torsion coupling experiments. Nevertheless, the calculation establishes a consistent, gauge-invariant bridge between quantum vacuum phenomena and non-Riemannian geometry. We discuss finite-temperature effects and geometric asymmetries as potential pathways for enhancing sensitivity, while placing the results in the broader context of dynamical torsion, condensed matter analogs, and quantum information protocols. Our results are consistent with the CPT-odd photon sector of the Standard-Model Extension and provide a geometric interpretation of Lorentz-violating coefficients in terms of spacetime torsion.", "url": "https://arxiv.org/abs/2608.10009", "type": "理论", "summary": "我们计算在具有恒定轴向扭矩的时空中完美导电的平行板之间的卡西米尔力。在有效场论框架内，扭转通过规范不变的陈-西蒙斯型相互作用耦合到电磁场，我们推导了修改后的光子色散关系和模式谱。使用 zeta 函数正则化，我们获得了扭转参数中的真空能量和由此产生的二阶卡西米尔压力。我们的计算得出的校正比例为 $\\Delta P/P_0 = -\\frac{5\\xi^2 S_z^2 a^2}{4\\pi^2} + \\order(S_z^4)$，这对应于卡西米尔吸引力的轻微减弱。我们承认文献中已知的微妙之处：因为陈-西蒙斯相互作用是全导数，一些分析得出结论，它不应对标准边界条件的卡西米尔能量有贡献，这意味着主要修正是更高阶的，$\\order(S_z^4)$。\n\n对于实验上可实现的板分离 ($a \\sim \\qty{1}{\\micro\\meter}$)，由于自旋扭转耦合实验对宏观扭转的严格限制，其效果仍然远低于当前检测阈值 ($|\\Delta P/P_0| \\lesssim 10^{-30}$)。尽管如此，计算在量子真空现象和非黎曼几何之间建立了一致的、规范不变的桥梁。我们讨论有限温度效应和几何不对称作为增强灵敏度的潜在途径，同时将结果置于动态扭转、凝聚态物质模拟和量子信息协议的更广泛背景下。我们的结果与标准模型扩展的 CPT 奇光子扇区一致，并提供了时空扭转方面洛伦兹破坏系数的几何解释。", "authors": [{"name": "M.W. AlMasri"}], "featured_authors": [{"name": "M.W. AlMasri"}], "author_count": 1}, {"id": "2608.10060", "category": "hep-th", "title": "Complexity measures in holographic cascading theories with multiscale dynamics", "abstract": "Using the gravitational duals, we perform a systematic study of two notions of complexity in a family of three-dimensional gauge theories with rich infrared structure. For thermofield double states, we employ the complexity=volume prescription, which relates computational complexity to the volume of the dual Einstein-Rosen bridge. For one particle states created by the insertion of a local operator on the vacuum, we study their spreading in Krylov space, encoded holographically by the radial momentum of bulk excitations. We investigate these two notions of complexity across the parameter space of the theories, focusing on the two limiting values of a tunable parameter. Near the limit where the theories flow close to an intermediate conformal fixed point, both notions reveal distinct manifestations of ``walking'' dynamics. Near the opposite limit, computational complexity is largely insensitive to the confining nature of the ground state, whereas the frequency of oscillations in the Krylov spread complexity -- set by the emerging infrared scale -- is sensitive to the presence of confinement.", "url": "https://arxiv.org/abs/2608.10060", "type": "理论", "summary": "利用引力对偶，我们对具有丰富红外结构的三维规范理论族中的两种复杂性概念进行了系统研究。对于热场双态，我们采用复杂性=体积规定，它将计算复杂性与双爱因斯坦-罗森桥的体积联系起来。对于通过在真空中插入局部算子而创建的一种粒子态，我们研究了它们在克雷洛夫空间中的扩散，并通过体激发的径向动量进行全息编码。我们研究了理论参数空间中的这两个复杂性概念，重点关注可调参数的两个极限值。在理论接近中间共形不动点的极限附近，这两个概念都揭示了“行走”动力学的不同表现。在相反的极限附近，计算复杂性在很大程度上对基态的限制性质不敏感，而克雷洛夫扩展复杂性的振荡频率（由新兴的红外尺度设定）对限制的存在敏感。", "authors": [{"name": "Carlos Nunez"}, {"name": "Juan F. Pedraza"}, {"name": "Javier G. Subils"}], "featured_authors": [{"name": "Carlos Nunez"}, {"name": "Juan F. Pedraza"}, {"name": "Javier G. Subils"}], "author_count": 3}, {"id": "2608.10072", "category": "hep-th", "title": "Recursion Coefficients and Krylov Dynamics in Polynomial Random Matrix Models", "abstract": "We study the recursion coefficients of orthogonal polynomials and their associated Krylov dynamics in random matrix models with high-degree and possibly asymmetric polynomial potentials. We develop a moment recursion method that, when combined with the recursive algorithm, provides an efficient construction of the recursion coefficients. We also obtain their large-$n$ asymptotic behavior for general asymmetric potentials; for $Nw_d=1$, the leading asymptotic form of $R_n$ reproduces Freud's conjecture. We apply this framework to an asymmetric quartic potential and to the double-scaled Sachdev-Ye-Kitaev (DSSYK) model. In both models, the recursion functions capture the overall qualitative behavior of the recursion coefficients, and the gradient catastrophes of the recursion functions are associated with ``chaotic'' transition regions in the recursion coefficients. For the quartic potential, such regions can occur in both $R_n$ and $S_n$, whereas the DSSYK model can exhibit multiple transition regions in $R_n$, with the recursion function remaining accurate in the smooth intervals between them. Finally, we compute the corresponding spread complexity and find that transition regions do not qualitatively modify its behavior, while a two branch structure produces early time oscillations followed by monotonic growth.", "url": "https://arxiv.org/abs/2608.10072", "type": "理论", "summary": "我们研究具有高次且可能不对称多项式势的随机矩阵模型中正交多项式的递归系数及其相关的 Krylov 动力学。我们开发了一种矩递归方法，当与递归算法结合时，可以提供递归系数的有效构造。我们还获得了它们对于一般不对称势的大$n$渐近行为；对于 $Nw_d=1$，$R_n$ 的领先渐近形式再现了弗洛伊德的猜想。我们将此框架应用于不对称四次势和双尺度 Sachdev-Ye-Kitaev (DSSYK) 模型。在这两个模型中，递归函数捕获递归系数的整体定性行为，并且递归函数的梯度灾难与递归系数中的“混乱”过渡区域相关。对于四次势，此类区域可以出现在 $R_n$ 和 $S_n$ 中，而 DSSYK 模型可以在 $R_n$ 中呈现多个过渡区域，并且递归函数在它们之间的平滑间隔中保持准确。\n\n最后，我们计算相应的扩展复杂度，发现过渡区域不会定性地改变其行为，而两分支结构会产生早期振荡，然后单调增长。", "authors": [{"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "featured_authors": [{"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "author_count": 2}, {"id": "2608.10082", "category": "hep-th", "title": "Tetra-quadric CY Threefold and Assisted Fibre Inflation", "abstract": "In the context of type IIB superstring compactification, we demonstrate the assisted fibre inflation proposal for a four-field model realized using the orientifold of a tetra-quadric Calabi-Yau (CY) threefold. This CY threefold has an underlying permutation symmetry $S_4$ and belongs to both the list of CY threefolds, namely the Kreuzer-Skarke (KS) database as well as the Complete Intersection Calabi-Yau (CICY) database. After fixing the overall volume modulus of the CY threefold using the framework of perturbative large volume scenario, there are three Kähler moduli which remain flat and assist in driving fibre inflation via sub-leading corrections. In a particular benchmark model, we show that the effective inflaton shift of around $5.7$ M$_p$, as needed for driving fibre inflation, can be successfully shared by three inflaton moduli which need to be individually shifted by nearly $2.2$ M$_p$ only ! The main motivation for the work is to show that the effective large field excursions of the inflaton field is possible without the need of pushing the individual volume moduli towards a large super-Planckian excursion or close to the boundary of the Kähler cone which may create various subsequent challenges for the effective field theory and supergravity approximations, especially in Swiss-Cheese based models of fibre inflation.", "url": "https://arxiv.org/abs/2608.10082", "type": "理论", "summary": "在IIB型超弦紧致化的背景下，我们展示了使用四二次Calabi-Yau（CY）三重的东方折叠实现的四场模型的辅助纤维膨胀建议。该 CY 三重具有基础排列对称性 $S_4$，并且属于 CY 三重列表，即 Kreuzer-Skarke (KS) 数据库以及完全交集 Calabi-Yau (CICY) 数据库。使用扰动大体积场景的框架将 CY 的整体体积模量固定为三倍后，三个凯勒模量保持平坦，并通过次领先修正帮助驱动纤维膨胀。在一个特定的基准模型中，我们表明，驱动纤维膨胀所需的大约 $5.7$ M$_p$ 的有效暴胀偏移可以成功地由三个暴胀模量共享，而这三个暴胀模量只需要单独偏移近 $2.2$ M$_p$ ！\n\n这项工作的主要动机是证明暴胀场的有效大场偏移是可能的，而不需要将单个体积模量推向大的超普朗克偏移或接近凯勒锥体的边界，这可能会给有效场理论和超重力近似带来各种后续挑战，特别是在基于瑞士奶酪的纤维膨胀模型中。", "authors": [{"name": "Swagata Bhattacharyya"}, {"name": "George K. Leontaris"}, {"name": "Pramod Shukla"}], "featured_authors": [{"name": "Swagata Bhattacharyya"}, {"name": "George K. Leontaris"}, {"name": "Pramod Shukla"}], "author_count": 3}, {"id": "2608.10085", "category": "hep-th", "title": "Approximate locality, black hole complementarity and overlapping qubits", "abstract": "We construct a toy model of an evaporating black hole using approximately local degrees of freedom acting on ``overlapping\" qubits in which a version of black hole complementarity arises naturally. The operators corresponding to the radiation and the interior are identified as two distinct representations of the same fundamental algebra, thereby preventing the exact factorization of the Hilbert space into interior and exterior and avoiding the conventional no-cloning violations. We show how this toy model captures several qualitative and quantitative features of black hole evaporation and how the ability to account for this ``overlap\" in the entropy calculation leads to the recovery of a Page curve.", "url": "https://arxiv.org/abs/2608.10085", "type": "理论", "summary": "我们使用作用于“重叠”量子位的近似局部自由度构建了蒸发黑洞的玩具模型，其中自然出现了黑洞互补性的版本。对应于辐射和内部的算子被识别为相同基本代数的两个不同表示，从而防止希尔伯特空间精确分解为内部和外部，并避免传统的不可克隆违规。我们展示了这个玩具模型如何捕获黑洞蒸发的几个定性和定量特征，以及如何在熵计算中考虑这种“重叠”的能力导致页面曲线的恢复。", "authors": [{"name": "ChunJun Cao"}, {"name": "Gong Cheng"}, {"name": "Alexander Jahn"}, {"name": "Thomas Koutsikos"}], "featured_authors": [{"name": "ChunJun Cao"}, {"name": "Gong Cheng"}, {"name": "Alexander Jahn"}, {"name": "Thomas Koutsikos"}], "author_count": 4}, {"id": "2608.10133", "category": "hep-th", "title": "Towards a Proof of Mass Gap in 3d Yang-Mills Theory", "abstract": "We give the outlines of a proof for the existence of a mass gap for the 3d Yang-Mills theory in terms of an inequality on the eigenvalues of the Laplacian on the gauge-invariant configuration space.", "url": "https://arxiv.org/abs/2608.10133", "type": "理论", "summary": "我们根据规范不变构型空间上拉普拉斯算子特征值的不等式给出了 3d Yang-Mills 理论质量间隙存在性的证明。", "authors": [{"name": "V.P. Nair"}], "featured_authors": [{"name": "V.P. Nair"}], "author_count": 1}, {"id": "2608.10348", "category": "hep-th", "title": "Holographic Complexity as a Probe of Boundary Entropy in AdS/BCFT", "abstract": "This work establishes a formal bridge between the organizational principles of TQFTs and the AdS/BCFT correspondence, interpreting end of the world EOW branes as physical interfaces carrying boundary-state data. By developing a dictionary that maps cobordism composition to holographic sewing, we show that the Euclidean action and the Ryu and Takayanagi prescription consistently isolate the universal boundary entropy (log g). Applying the Complexity-Action proposal, we demonstrate that a relative renormalization prescription extracts this same universal contribution from the Wheeler and DeWitt action. Finally, we extend the analysis to BTZ black holes, where the late-time complexity growth is shown to encode both the thermal interior dynamics and the universal information of the boundary conditions via the brane tension.", "url": "https://arxiv.org/abs/2608.10348", "type": "理论", "summary": "这项工作在 TQFT 的组织原则和 AdS/BCFT 通信之间建立了一座正式的桥梁，将世界
